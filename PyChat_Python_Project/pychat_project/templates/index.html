<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyChat | Join</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="entry-page">
  <main class="entry-card">
    <div class="logo">P</div>
    <p class="eyebrow">SIMPLE • FAST • CONNECTED</p>
    <h1>Welcome to PyChat</h1>
    <p class="muted">Choose a username and join the conversation.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="username">Your username</label>
      <input id="username" name="username" maxlength="24" placeholder="e.g. Alex" required autofocus>
      <button type="submit">Join chat <span>→</span></button>
    </form>
    <p class="footnote">A student-built Python chat application.</p>
  </main>
</body>
</html>
